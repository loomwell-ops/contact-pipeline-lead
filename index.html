<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-5YkdtF0/t1UL/FtYJR6xX4OoqUqPoK3Ci4gY1tmp2JU=' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/ https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; object-src 'none'; manifest-src 'self'; form-action 'self'">
<meta name="theme-color" content="#4b3fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%234b3fd6%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2752%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3ELO%3C/text%3E%3C/svg%3E">
<script>
(function(){
  var s=null; try{s=localStorage.getItem('crm-theme')}catch(e){}
  if(s!=='dark'&&s!=='light'){s=matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
  document.documentElement.setAttribute('data-theme',s);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mod-forms.css"><!-- Module 2: lead forms. Remove this line and the mod-forms.js line to leave it out -->
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<!-- FR-1: VERSO Split-Card Login -->
<div id="login" hidden>
  <div class="auth-card">
    <form id="loginForm" class="auth-form">
      <div class="auth-eyebrow">Operator Access</div>
      <h1 id="loginBrand">CRM</h1>
      <p class="auth-sub">Sign in to manage your contacts, pipeline, and notes.</p>
      <label>Email
        <input id="email" type="email" autocomplete="username" placeholder="you@company.com" required>
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <button class="pri full" id="loginBtn" type="submit">Log in</button>
      <button class="ghost full" id="forgot" type="button">Forgot password?</button>
    </form>
    <div class="auth-side" aria-hidden="true">
      <div class="auth-badge">Module 1 · Contacts &amp; Pipeline</div>
      <h2 id="loginBrandSide">CRM</h2>
      <p>Fast lead tracking, drag-and-drop deal stages, and a dated timeline per contact—backed by Supabase RLS.</p>
      <div class="auth-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<!-- Main App Shell -->
<div id="app" hidden>
  <a class="skip" href="#view">Skip to content</a>
  <aside class="rail" aria-label="Primary navigation">
    <div class="rail-brand" id="brandMark" title="CRM">LO</div>
    <nav id="railNav">
      <div id="railPill" aria-hidden="true"></div>
      <button type="button" data-v="pipeline" data-tip="Pipeline" aria-label="Pipeline">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="14" rx="1.5"/></svg>
        <span>Pipeline</span>
      </button>
      <button type="button" data-v="contacts" data-tip="Contacts" aria-label="Contacts">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Contacts</span>
      </button>
      <button type="button" data-v="reports" data-tip="Reports" aria-label="Reports">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Reports</span>
      </button>
      <button type="button" data-v="settings" data-tip="Settings" aria-label="Stage Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
    <div class="rail-foot">
      <button type="button" id="railToggle" data-tip="Expand" aria-label="Expand sidebar" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
        <span>Collapse</span>
      </button>
      <button type="button" id="themeBtn" data-tip="Theme" aria-label="Toggle theme">
        <svg id="themeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span>Theme</span>
      </button>
      <button type="button" id="logout" data-tip="Log out" aria-label="Log out">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <div class="brand-sub" id="brand"></div>
        <h1 id="viewTitle">Pipeline</h1>
      </div>
      <div id="viewActions" class="top-actions"></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Pinned versions so a new release can never change behavior -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" integrity="sha384-BSxuMLxX+FCbTdYec3TbXlnMGEEM2QXTFdtDaveen71o+jswm2J36+xFqp8k4VHM" crossorigin="anonymous"></script>
<script src="app.js"></script>
<script src="mod-forms.js"></script>
<script src="mod-email.js"></script><!-- Module 3a: email readiness. Remove this line and delete mod-email.js to leave it out -->
<script src="mod-email-templates.js"></script><!-- Module 3b (phase B): email templates, merge fields, preview. Must come before mod-email-send.js. Remove this line to leave it out -->
<script src="mod-email-send.js"></script><!-- Module 3a phase A: compose and send email from the contact panel. Remove this line to leave it out -->
</body>
</html>
