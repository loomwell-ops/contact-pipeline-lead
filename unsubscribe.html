<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#4b3fd6;--accent:var(--brand);--g2:#c24e17;--on:#fff;--bg:#f6f5fd;--card:#fff;--ink:#1a1840;--mut:#5b5a7d;--line:#dedcf2;--glow:rgba(75,63,214,.22)}
@media(prefers-color-scheme:dark){:root{--accent:color-mix(in srgb,var(--brand) 62%,#fff);--g2:#ff9a76;--on:#0f0d24;--bg:#0f0d24;--card:#1b183c;--ink:#ecebfa;--mut:#a8a6cf;--line:#322d66;--glow:rgba(156,147,255,.36)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;perspective:1200px;background:radial-gradient(900px 440px at 82% -8%,var(--glow),transparent 65%),var(--bg)}
#card{width:100%;max-width:460px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px) saturate(155%);-webkit-backdrop-filter:blur(18px) saturate(155%);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:20px;padding:30px;box-shadow:0 30px 72px var(--glow),inset 0 1px 0 rgba(255,255,255,.28);animation:cardIn3D .42s cubic-bezier(.22,1,.36,1)}
@keyframes cardIn3D{from{opacity:0;transform:perspective(1000px) rotateX(6deg) translateY(14px) scale(.98)}to{opacity:1;transform:none}}
h1{font:700 1.45rem/1.15 "Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0 0 8px}p{color:var(--mut);margin:0 0 16px}
button{width:100%;padding:12px 16px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,var(--g2)));color:var(--on);font:600 15px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 26px var(--glow),inset 0 1px 0 rgba(255,255,255,.38);transition:transform .16s,box-shadow .16s}
button:hover{transform:translateY(-2px);box-shadow:0 14px 32px var(--glow)}
button:disabled{opacity:.6;cursor:wait;transform:none}
</style>
</head>
<body>
<main id="card"><p>Loading…</p></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const C = window.CRM_CONFIG, sb = supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
const token = new URLSearchParams(location.search).get('t') || '';
const card = document.getElementById('card');
document.documentElement.style.setProperty('--brand', C.accent);
document.title = 'Unsubscribe · ' + C.businessName;
const say = h => card.innerHTML = h;
if (!token) say('<h1>Link not valid</h1><p>This unsubscribe link is missing its code. Please use the link from the email.</p>');
else {
  say('<h1>Unsubscribe from emails?</h1><p>You will stop receiving emails from ' + C.businessName.replace(/[&<>"']/g, '') + '.</p><button id="go">Unsubscribe</button>');
  document.getElementById('go').onclick = async e => {
    const b = e.target; b.disabled = true; b.textContent = 'Working…';
    let res; try { const { data, error } = await sb.rpc('unsubscribe_contact', { p_token: token }); res = error ? { ok: false } : data; } catch (x) { res = { ok: false }; }
    if (res && res.ok) say('<h1>You are unsubscribed</h1><p>You will not receive any more emails from us.</p>');
    else { b.disabled = false; b.textContent = 'Unsubscribe'; card.insertAdjacentHTML('beforeend', '<p>Something went wrong. Please try again.</p>'); }
  };
}
</script>
</body>
</html>
