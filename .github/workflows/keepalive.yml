# Pings Supabase once a week so the free project never pauses from inactivity.
# Upload this file to your repo at: .github/workflows/keepalive.yml
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday at 03:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive function
        # The anon key is public by design (same one as config.js). -f makes the job fail on any HTTP error.
        run: |
          curl -fsS -X POST "https://daxftvwilzdtkxcsbtxz.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRheGZ0dndpbHpkdGt4Y3NidHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNzY2NTUsImV4cCI6MjExMDg1MjY1NX0.ZbeeTm3JbkXesMM2SDTbSwDOyrfqCSP7GDnPQI8KjcI" \
            -H "Content-Type: application/json" -d '{}'
